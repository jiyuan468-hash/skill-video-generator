    .card:hover { border-color: #7b2dff; transform: translateY(-4px); box-shadow: 0 8px 30px rgba(123,45,255,0.2); }
    .card-platform { font-size: 0.75rem; color: #7b2dff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .card-title { font-size: 1.1rem; color: #fff; margin-bottom: 6px; }
    .card-desc { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
    .card-tag { display: inline-block; padding: 3px 10px; background: #2a2a4a; border-radius: 20px; font-size: 0.75rem; color: #aaa; margin-right: 5px; }
    .card-tag.type-text { background: #1a3a2e; color: #4ade80; }
    .card-tag.type-code { background: #3a1a2e; color: #f472b6; }
    .stats { display: flex; justify-content: center; gap: 40px; padding: 30px; background: #1a1a2e; margin: 20px 0; border-radius: 12px; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 2rem; font-weight: bold; background: linear-gradient(90deg, #00d4ff, #7b2dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-label { font-size: 0.85rem; color: #888; margin-top: 4px; }
    .code-block { background: #0d0d1a; border: 1px solid #2a2a4a; border-radius: 8px; padding: 15px; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #4ade80; margin-top: 10px; word-break: break-all; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-content { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 16px; padding: 30px; max-width: 500px; width: 90%; }
    .modal h2 { color: #fff; margin-bottom: 15px; }
    .modal-close { float: right; cursor: pointer; color: #888; font-size: 1.5rem; }
    .modal-close:hover { color: #fff; }
    .btn-copy { background: #7b2dff; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; margin-top: 15px; width: 100%; }
    .btn-copy:hover { background: #6a1ff0; }
    .search { max-width: 400px; margin: 0 auto 20px; padding: 12px 20px; background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; color: #fff; font-size: 1rem; }

    .platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin: 30px 0; }

    .footer { text-align: center; padding: 40px; color: #555; font-size: 0.85rem; }

let currentFilter = 'all';

function renderTemplates(list) {
  const grid = document.getElementById('templateGrid');
  grid.innerHTML = list.map((t, i) => 
    <div class="card" onclick="showModal()">
      <div class="card-platform"></div>
      <div class="card-title"></div>
      <div class="card-desc"></div>
      <span class="card-tag "></span>
    </div>
  ).join('');
}

function filterPlatform(p) {
  currentFilter = p;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const filtered = p === 'all' ? templates : templates.filter(t => t.platform === p);
  renderTemplates(filtered);
}

function searchTemplates(q) {
  const q2 = q.toLowerCase();
  const filtered = templates.filter(t =>
    t.title.toLowerCase().includes(q2) ||
    t.desc.toLowerCase().includes(q2) ||
    t.platform.toLowerCase().includes(q2)
  );
  renderTemplates(filtered);
}

function showModal(i) {
  const t = templates[i];
  document.getElementById('modalTitle').textContent = t.title;
  document.getElementById('modalDesc').textContent = t.desc + '  (' + t.platform + ' · ' + (t.type === 'text' ? '文本' : '动画') + ')';
  document.getElementById('modalCommand').textContent = t.cmd;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function copyCommand() {
  const cmd = document.getElementById('modalCommand').textContent;
  navigator.clipboard.writeText(cmd);
  const btn = document.querySelector('.btn-copy');
  btn.textContent = '已复制!';
  setTimeout(() => btn.textContent = '复制命令', 1500);
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

renderTemplates(templates);
